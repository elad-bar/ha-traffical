repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py39-plus]
        exclude: ^engine/
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args:
          - --quiet
        files: ^((custom_components|tests)/.+)?[^/]+\.py$
        exclude: ^engine/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,alot,datas,dof,dur,ether,farenheit,hist,iff,ines,ist,lightsensor,mut,nd,pres,referer,ser,serie,te,technik,ue,uint,visability,wan,wanna,withing,iam,incomfort,checkin,childrens
          - --skip="./.*,./*.svg,*.svg,*.csv,*.json"
          - --quiet-level=2
        exclude_types: [csv, json]
        exclude: ^(engine/|debug/|data/|app/)
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
        exclude: ^engine/
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - pycodestyle
          - pyflakes
          - flake8-comprehensions
          - flake8-noqa
          - mccabe
        files: ^(custom_components|tests)/.+\.py$
        exclude: ^engine/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - --quiet
          - --format=custom
          - --configfile=bandit.yaml
        files: ^(custom_components)/.+\.py$
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort
        exclude: ^engine/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        exclude: (.vscode|.devcontainer)
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^engine/
      - id: end-of-file-fixer
        exclude: ^(engine/|docs/(product-overview|api-reference|passenger-experience|home-assistant-integration)\.md)
      - id: trailing-whitespace
        exclude: ^(engine/|docs/(product-overview|api-reference|passenger-experience|home-assistant-integration)\.md)
      - id: check-added-large-files
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0-alpha.4
    hooks:
      - id: prettier
        exclude: ^(engine/|debug/|data/|app/|docs/(product-overview|api-reference|passenger-experience|home-assistant-integration)\.md)
